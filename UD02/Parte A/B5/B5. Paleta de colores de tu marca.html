<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Paleta de colores</title>
    </head>

<body>

    <h1>Paleta de colores de la marca</h1>

    <!-- ROJO -->
    <h2 style="color: rgb(255, 0, 0);">Rojo (RGB)</h2>
    <h2 style="color: #ff0000;">Rojo (HEX)</h2>
    <h2 style="color: hsl(0, 100%, 50%);">Rojo (HSL)</h2>

    <hr>

    <!-- NARANJA -->
    <h2 style="color: rgb(255, 165, 0);">Naranja (RGB)</h2>
    <h2 style="color: #ffa500;">Naranja (HEX)</h2>
    <h2 style="color: hsl(39, 100%, 50%);">Naranja (HSL)</h2>

    <h2 style="color: MediumSeaGreen;">MediumSeaGreen</h2>
    <h2 style="color: #ee82ee;">Violet</h2>

    <!-- rgb(0, 0, 255) representa el color azul.  El primer valor corresponde a rojo ( Red ), el segundo al verde ( Green ) y el tercero al azul ( Blue ).
     En HSL sería rojo = hsl(0, 100%, 50%), verde = hsl(120, 100%, 50%), azul = hsl(240, 100%, 50%)
     El valor hue (matiz) nos indica la posición del color en la ruta cromática:
     0º = rojo
     120º = verde
     240º = azul-->
    </body>
</html>
